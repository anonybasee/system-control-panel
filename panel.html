<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIMULATED</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: "Courier New", monospace;
  overflow: hidden;
}

/* MATRIX BACKGROUND */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* YOUR ORIGINAL CONTENT STAYS ON TOP */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 60px;
  color: red;
  text-shadow: 0 0 20px red, 0 0 40px darkred;
  animation: blink 0.5s infinite alternate;
}

h2 {
  font-size: 25px;
  color: #00ff00;
}

.warning {
  margin-top: 20px;
  font-size: 18px;
  color: white;
  opacity: 0.8;
}

@keyframes blink {
  from { opacity: 1; }
  to { opacity: 0.2; }
}

.glitch {
  animation: glitch 0.2s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(2px, -2px); }
  60% { transform: translate(-2px, -2px); }
  80% { transform: translate(2px, 2px); }
  100% { transform: translate(0); }
}
</style>
</head>

<body>

<!-- MATRIX CANVAS -->
<canvas id="matrix"></canvas>

<!-- AUDIO -->
<audio id="bgAudio" src="siren.mp3" loop></audio>

<div class="center glitch">
  <h1>YOU ARE MOVING</h1>
  <h2>ACCESS GRANTED BY UNKNOWN SOURCE</h2>
  <div class="warning">
    SYSTEM BREACH DETECTED...<br>
    FILES COMPROMISED...<br>
    LOCATION TRACKING ACTIVE...<br>
    DATA BROKED...<br><br>
  </div>
</div>

<div class="center">
  <h1 id="text">Starting...</h1>
</div>

<script>

/* AUDIO START */
window.addEventListener("click", () => {
  document.getElementById("bgAudio").play();
}, { once: true });

/* MATRIX EFFECT */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(drawMatrix, 50);

/* NUMBER COUNTER */
let i = 1;
const text = document.getElementById("text");

const interval = setInterval(() => {
  text.innerHTML = i;
  i++;

  if (i > 100) {
    clearInterval(interval);

    text.innerHTML = "SIMULATION STARTED";

    setTimeout(() => {
      window.close();
    }, 2000);
  }
}, 50);

</script>

</body>
</html>
