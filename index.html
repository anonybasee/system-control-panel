<!DOCTYPE html>
<html>
<head>
<title>Secure Terminal</title>

<style>
body {
  margin:0;
  background:black;
  color:#00ff00;
  font-family: monospace;
  overflow:hidden;
}

canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.box {
  text-align:center;
  margin-top:120px;
}

input {
  padding:10px;
  margin:5px;
  background:black;
  border:1px solid #00ff00;
  color:#00ff00;
  outline:none;
}

button {
  padding:10px 20px;
  background:black;
  border:1px solid #00ff00;
  color:#00ff00;
  cursor:pointer;
}

#msg {
  margin-top:20px;
  font-size:14px;
}

.glitch {
  animation: glitch 0.3s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(2px, -2px); }
  50% { transform: translate(-2px, 2px); }
  75% { transform: translate(2px, 2px); }
  100% { transform: translate(0); }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">
  <h2>ACCESS TERMINAL</h2>

  <input id="user" placeholder="USERNAME"><br>
  <input id="pass" type="password" placeholder="PASSWORD"><br><br>

  <button onclick="login()">INIT ACCESS</button>

  <p id="msg"></p>
</div>

<audio id="beep">
  <source src="https://www.soundjay.com/button/beep-07.mp3" type="audio/mpeg">
</audio>

<script>

// ===== MATRIX FIX (RESPONSIVE) =====
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;
}

resize();
window.addEventListener("resize", resize);

let letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];

for(let x=0; x<columns; x++) drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for(let i=0;i<drops.length;i++){
    let text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random()>0.975)
      drops[i]=0;

    drops[i]++;
  }
}

setInterval(draw,33);

// ===== LOGIN =====
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  let msg = document.getElementById("msg");
  let beep = document.getElementById("beep");

  // FIX: sound safety
  beep.currentTime = 0;
  beep.play().catch(()=>{});

  msg.innerHTML = "Scanning system...";

  setTimeout(()=>{ msg.innerHTML="Decrypting data..." },1000);
  setTimeout(()=>{ msg.innerHTML="Checking firewall..." },2000);

  setTimeout(()=>{

    if(u==="LNX" && p==="BDA123"){

      msg.innerHTML="ACCESS GRANTED ✔";
      document.body.classList.add("glitch");

      beep.currentTime = 0;
      beep.play().catch(()=>{});

      setTimeout(()=>{
        window.location.href="admin.html";
      },2000);

    } else {

      msg.innerHTML="ACCESS DENIED ✖";
      document.body.classList.add("glitch");

      setTimeout(()=>{
        document.body.classList.remove("glitch");
      },1000);

    }

  },3000);
}

</script>

</body>
</html>
